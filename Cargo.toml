[package]
name = "dabovanie-videi-v2"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Automatizovaný video dabing zo slovenčiny do čínštiny s lip-sync."
license = "MIT"

[dependencies]
anyhow = "1.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.40", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
